name: Idea / 아이디어
description: Furniture, a role, a feature, a surprise… / 가구, 직군, 기능, 깜짝 요소…
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea / 아이디어
      description: What you'd like, and what it would be useful for.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Helping / 도움
      options:
        - label: I'd like to build it myself (with Claude Code, that's fine!) / 직접 만들어 보고 싶어요
